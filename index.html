<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Card Tally Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#12151d; --panel:#1b1f2a; --sunk:#0d1016; --line:#2c3242; --fg:#e8ebf2; --muted:#98a0b3;
  --accent:#f2bf26; --accent-ink:#2a2100; --ink:#3a4a75; --ok:#5fd39c; --danger:#ff7a63;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation:landscape){.app{flex-direction:row}}

/* camera */
.cam{position:relative;flex:1;min-height:0;min-width:0;background:#000;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;pointer-events:none}
.guide{position:absolute;left:8%;right:8%;top:50%;height:var(--gh,13%);transform:translateY(-50%);border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.guide.hit{border-color:var(--ok)}
.guide::after{content:"line up:  H  SVI  EN  086/198";position:absolute;left:0;right:0;top:calc(100% + 6px);text-align:center;font:600 12px var(--display);letter-spacing:.06em;color:rgba(255,255,255,.75)}
.camtools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.round{width:46px;height:46px;border-radius:50%;background:rgba(13,16,22,.75);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.round[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zoom{position:absolute;left:12px;right:70px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(13,16,22,.7);border-radius:99px;padding:6px 12px}
.zoom input{flex:1;accent-color:var(--accent)}
.zoom span{font:600 12px var(--display);min-width:3em;text-align:right}
.ocrview{position:absolute;left:10px;top:10px;max-width:60%;border:1px solid var(--line);background:#fff;image-rendering:pixelated}
.raw{position:absolute;left:10px;top:10px;font:500 11px ui-monospace,monospace;background:rgba(13,16,22,.75);padding:3px 7px;border-radius:5px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocrview+.raw{top:auto;bottom:62px}
.start{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:var(--bg)}
.start h1{font:700 26px var(--display);margin:0 0 6px;letter-spacing:.04em}
.start p{color:var(--muted);max-width:28em;margin:0 auto 16px;line-height:1.5}
.big{background:var(--accent);color:var(--accent-ink);font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:14px 26px;border-radius:12px}

/* panel */
.panel{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:10px}
@media (orientation:landscape){.panel{width:min(360px,42%);border-top:0;border-left:1px solid var(--line);overflow-y:auto}}
.status{display:flex;align-items:center;gap:8px;min-height:22px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.found{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px}
.found .nm{font-size:20px;font-weight:600;line-height:1.15}
.found .meta{font:600 13px var(--display);letter-spacing:.04em;color:var(--muted)}
.found .alts{display:flex;gap:6px;flex-wrap:wrap}
.found .alts button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.found .alts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:700 22px var(--display)}
.qty span{font:700 24px var(--display);min-width:2em;text-align:center}
.add{flex:1;height:52px;border-radius:12px;background:var(--ok);color:#06210f;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase}
.skip{height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font-size:13px;font-weight:600;line-height:1.1;padding:2px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.chip.foil{border:2px solid transparent}
.chip.foil[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.chip.holo{background:linear-gradient(var(--sunk),var(--sunk)) padding-box,linear-gradient(135deg,#f4f6f9,#9aa3b1 30%,#fff 50%,#8d96a5 70%,#e9edf2) border-box}
.chip.holo span{background:linear-gradient(90deg,#e63946,#f4a020,#e9d22a,#3bb273,#2f86d6,#7a4fd0,#d2459d);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip.silver,.chip.ball,.chip.alt{color:#1b2030;text-shadow:0 0 2px #fff,0 0 2px #fff;border-color:#8d96a5}
.chip.silver{background:linear-gradient(115deg,#c9ced6,#f4f6f9 28%,#aab2be 50%,#eef1f5 72%,#bcc3cd)}
.chip.ball{background:radial-gradient(circle,#fff 0 2.2px,transparent 2.6px) 0 0/16px 16px,radial-gradient(circle,transparent 0 4.4px,rgba(60,66,85,.45) 4.6px 5.4px,transparent 5.6px) 0 0/16px 16px,linear-gradient(115deg,#c9ced6,#f4f6f9 28%,#aab2be 50%,#eef1f5 72%,#bcc3cd)}
.chip.alt{background:repeating-linear-gradient(45deg,rgba(122,79,208,.3) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(122,79,208,.3) 0 2px,transparent 2px 9px),linear-gradient(115deg,#d3cde0,#f6f4fa 28%,#b3abc6 50%,#f1eef7 72%,#c6bfd6)}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;gap:8px}
.foot button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-weight:600}
.foot .batchbtn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* batch sheet */
.sheet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.list{flex:1;overflow-y:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--muted)}
.item .ct{font:700 16px var(--display);min-width:2.2em;text-align:center}
.item button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);font:700 18px var(--display)}
.sheet .actions{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--line)}
.sheet .actions p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.empty{padding:24px 14px;color:var(--muted);line-height:1.5}
.confirmclear{display:flex;gap:8px;align-items:center;font-size:13px}
.confirmclear button{padding:10px 14px;border-radius:9px;border:1px solid var(--line)}
.confirmclear .danger{background:var(--danger);color:#2a0700;border-color:transparent;font-weight:700}
textarea.out{width:100%;height:90px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,monospace;padding:6px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;z-index:9;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{pointer-events:auto}
.err{color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <section class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="guide" id="guide"></div>
    <canvas class="ocrview" id="ocrview" hidden></canvas>
    <div class="raw" id="raw" hidden></div>
    <div class="camtools">
      <button class="round" id="torch" aria-pressed="false" aria-label="Flashlight" hidden>🔦</button>
      <button class="round" id="debug" aria-pressed="false" aria-label="Show what the reader sees">👁</button>
      <button class="round" id="guideSize" aria-label="Change guide box height">↕</button>
    </div>
    <label class="zoom" id="zoomWrap" hidden>Zoom <input type="range" id="zoom" min="1" max="1" step="0.1"><span id="zoomVal">1×</span></label>
    <div class="start" id="start">
      <div>
        <h1>Card Tally Scanner</h1>
        <p>Point the box at the line in a card's bottom-left corner (like <b>SVI EN 086/198</b>). Works on Scarlet &amp; Violet and newer English cards.</p>
        <button class="big" id="startBtn">Start camera</button>
        <p id="startErr" class="err" hidden></p>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="status"><span class="dot" id="dot"></span><span id="status">Camera off</span></div>

    <div class="found" id="found" hidden>
      <div>
        <div class="nm" id="fName"></div>
        <div class="meta" id="fMeta"></div>
      </div>
      <div class="alts" id="fAlts" hidden></div>
      <div class="row">
        <div class="qty"><button id="qMinus" aria-label="One fewer">−</button><span id="qN">1</span><button id="qPlus" aria-label="One more">+</button></div>
        <button class="add" id="addBtn">Add</button>
      </div>
      <button class="skip" id="skipBtn">Not this card · keep scanning</button>
    </div>

    <div>
      <div class="lbl">Finish</div>
      <div class="chips" id="chips">
        <button class="chip" data-v="default">Default</button>
        <button class="chip" data-v="normal">Non-holo</button>
        <button class="chip foil holo" data-v="holo"><span>Holo</span></button>
        <button class="chip foil silver" data-v="reverse">Reverse</button>
        <button class="chip foil ball" data-v="pokeball">Poké Ball /<br>Patterned</button>
        <button class="chip foil alt" data-v="masterball">Alt Ball /<br>Alt Pattern</button>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="auto"> Add automatically when a card locks in</label>
    <div class="foot">
      <button class="batchbtn" id="openBatch">Batch · <span id="bCount">0</span></button>
    </div>
  </section>
</div>

<section class="sheet" id="sheet" hidden>
  <header><h2>Batch</h2><span id="sTotal" class="lbl"></span><button class="round" id="closeBatch" aria-label="Back to scanning">✕</button></header>
  <div class="list" id="list"></div>
  <div class="actions">
    <button class="big" id="copyBtn">Copy batch</button>
    <textarea class="out" id="out" readonly hidden></textarea>
    <p>Then open Card Tally, tap <b>Import</b> above the tally, and paste. Clear the batch here once it's imported.</p>
    <div class="confirmclear" id="clearRow"><button id="clearBtn">Clear batch</button></div>
  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script src="vendor/tesseract.min.js"></script>
<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
